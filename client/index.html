<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Javilindj | Admin Console</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="shortcut icon" href="images/audio.png" type="image/png">
</head>
<body>
  <div id="about" class="about-section">
    <div class="club-background"></div>
    <div class="about-glow"></div>
    <div class="equalizer">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <img src="images/dj-photo.jpg" alt="Javilindj" id="dj-photo">
    <h3>Javilindj</h3>
    <p>Hardcore, Jumpstyle & Newstyle Specialist</p>
  </div>

  <section id="admin-zone" class="admin-section">
    <div id="admin-form-container" style="display:none;">
      <form id="login-form">
        <input type="text" id="username" placeholder="Usuario" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit" class="traktor-btn">ACCEDER</button>
      </form>
    </div>
    
    <div id="admin-controls" style="display:none;">
      <div class="admin-dashboard">
        <div class="admin-status-bar">
          <span id="admin-indicator"><i class="fas fa-circle"></i> MODO DJ ACTIVO</span>
          <button id="logout-btn" class="traktor-btn-danger">SALIR</button>
        </div>

        <div class="admin-panel-module">
          <div class="module-header"><i class="fas fa-sliders-h"></i> GESTIONAR LIBRERÍA</div>
          <form id="session-form" class="traktor-form">
            <div class="input-group">
              <label for="title">TÍTULO DE LA SESIÓN</label>
              <input type="text" id="title" placeholder="Ej: Hardcore Session Vol.1" required>
            </div>

            <div class="input-group">
              <label for="coverUrl">RUTA DE CARÁTULA (Ej: /uploads/sesion1.jpg)</label>
              <input type="text" id="coverUrl" placeholder="/uploads/nombre-imagen.jpg">
            </div>
            
            <div class="input-row">
              <div class="input-group">
                <label for="year">AÑO</label>
                <input type="text" id="year" placeholder="2024" required>
              </div>
              <div class="input-group">
                <label for="downloadUrl">URL DESCARGA</label>
                <input type="url" id="downloadUrl" placeholder="https://..." required>
              </div>
            </div>

            <div class="input-group">
              <label for="description">DESCRIPCIÓN / TRACKLIST</label>
              <textarea id="description" rows="3" placeholder="Detalles de la sesión..."></textarea>
            </div>

            <button type="submit" id="submit-btn" class="traktor-btn-save">
              <i class="fas fa-save"></i> GUARDAR EN LIBRERÍA
            </button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <div class="filter-wrapper">
    <div class="filter-container">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Buscar en la maleta..." class="traktor-input">
      </div>
      <div class="filter-box">
        <i class="fas fa-calendar-alt"></i>
        <select id="year-filter" class="traktor-input">
          <option value="all">Todos los años</option>
        </select>
      </div>
    </div>
  </div>

  <div id="sessions" class="sessions-grid"></div>
  <div id="toast-container"></div>

  <section id="contact" class="contact-section">
    <div class="social-container">
        <a href="https://instagram.com/javilindj" target="_blank" class="social-item">
            <i class="fab fa-instagram"></i>
            <span>Instagram</span>
        </a>
        <a href="mailto:javigallegofenor@gmail.com" class="social-item">
            <i class="far fa-envelope"></i>
            <span>Email</span>
        </a>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
